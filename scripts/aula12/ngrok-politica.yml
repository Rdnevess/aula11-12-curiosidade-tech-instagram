on_http_request:
  - name: "somente GET/POST em /webhook/instagram"
    expressions:
      - "!(req.url.path == '/webhook/instagram' && req.method in ['GET', 'POST'])"
    actions:
      - type: custom-response
        config:
          status_code: 404
          body: "404 page not found"
          headers:
            content-type: text/plain
